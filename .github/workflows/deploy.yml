name: Deploy to Cloudflare

# 此仓库通过 Vercel 部署；如需恢复 Cloudflare 自动部署，
# 把触发条件改回 on.push.branches: [main] 并配置
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 两个 repository secrets。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_ORCA_APP_ID: ${{ vars.VITE_ORCA_APP_ID }}
        run: pnpm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
